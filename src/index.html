<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wordle</title>
    <style>
      body{font-family:Arial, Helvetica, sans-serif;text-align:center;background-color:black;color:white;}
      h1{font-size:60px}
      #r{border:1px solid white;width:max-content;margin:20px auto;padding:0 40px 20px;}
      #b{width:350px;height:420px;margin:0 auto;margin-top:3px;display:flex;flex-wrap:wrap;}
      #a{font-size:20px;margin-bottom:0;margin-top:100px;color:cyan;}
      .t{border:2px solid lightgray;width: 60px;height:60px;margin: 2.5px;color: white;font-size:36px;font-weight:bold;display:flex;justify-content: center;align-items: center;}
      .c{background-color:green;color:white;border-color:white;}
      .p{background-color:navy;color:white;border-color:white;}
      .a{background-color:purple;color:white;border-color:white;}
      .b{width:25px;height:25px;display:inline-block;vertical-align:middle;margin-right:10px;}
    </style>
</head>
<body>
    <div id="r">
    <h1>Wordle</h1>
    <br>
    <div id="b">
    </div>
    <br>
    <h3 id="a"></h3>
    <h1 id="a1"></h1>
    <p><span class="b c"></span>In the word and in the correct spot</p>
    <p><span class="b p"></span>In the word but not in the correct spot</p>
    <p><span class="b a"></span>Not in the word</p>
   </div>
</body>
<script>
  const h=6,w=5,word="TRACE";
  let r1=0,c1=0,over=false;
  const start =()=>{
    for(let r=0;r<h;r++){
        for(let c=0;c<w;c++){
            let t=document.createElement("span");
            t.id=r.toString() + "-" + c.toString();
            t.classList.add("t");
            t.innerText="";
            document.getElementById("b").appendChild(t);
        }
    }
  };
  start();
    document.addEventListener("keyup", (e)=> {
    if(over)return;
    if("KeyA"<=e.code && "KeyZ">=e.code){
        if(c1<w){
            let current_tile=document.getElementById(r1.toString() + '-' + c1.toString());
            if(current_tile.innerText==""){
                current_tile.innerText=e.code[3];
                c1+=1;
                type_sound(e.code[3]);
            }
        }
    }
        else if(e.code=="Backspace"){
            if(c1>0)backspace_sound();
            if(0<c1&&c1<=w)c1-=1;
            let current_tile= document.getElementById(r1.toString() + '-' + c1.toString());
            current_tile.innerText="";
        }
        else if(e.code=="Enter"&&c1==w){
            update();
            if(over)victory_sound();
            else enter_sound();
            r1+=1;
            c1=0;
        }
        if(!over&&r1==h){
            over=true;
            document.getElementById("a1").innerText=word;
            document.getElementById("a").innerText="Correct Answer";
        }
        
  });
    const update=()=>{
    let corr=0,letter_count={};
    for(let i=0;i<word.length;i++){
        letter=word[i];
        if(letter_count[letter])letter_count[letter]+=1;
        else letter_count[letter]=1;
    }
    for(let c=0;c<w;c++){
        let current_tile=document.getElementById(r1.toString()+'-'+c.toString());
        let letter=current_tile.innerText;
        if(word[c]==letter){current_tile.classList.add("c");corr+=1;letter_count[letter]-=1;}
        if(corr==w)over=true;
    }
     for(let c=0;c<w;c++){
         let current_tile=document.getElementById(r1.toString()+'-'+c.toString());
         let letter=current_tile.innerText;
      if(!current_tile.classList.contains("c")){
        if(word.includes(letter)&&letter_count[letter]>0){
            current_tile.classList.add("p");
            letter_count[letter]-=1;}
        else current_tile.classList.add("a");
      }
    }
  }
  let audio_ctx=null;
  document.addEventListener("keydown", ()=>{
    if(!audio_ctx)audio_ctx=new AudioContext();
    audio_ctx.resume();
    });
    const hz=(n)=>440*Math.pow(2,(n-69)/12);
    const A3=57,E3=52,A4=69,E5=76,C5=72,G5=79,C6=84;
    const m=(midi,s,d,type,vol,cutoff)=>{
      if(!audio_ctx)return;
      const t=audio_ctx.currentTime+s;
      const o=audio_ctx.createOscillator();
      const g=audio_ctx.createGain();
      const f=audio_ctx.createBiquadFilter();
      o.type=type;
      o.frequency.setValueAtTime(hz(midi),t);
      f.type="lowpass";
      f.frequency.value=cutoff;
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+d);
      o.connect(f);
      f.connect(g);
      g.connect(audio_ctx.destination);
      o.start(t);
      o.stop(t+d);
    };
    const type_sound=(letter)=>{
      m(60+(letter.charCodeAt(0)-65),0,0.09,"triangle",0.15,8000);
    };
    const backspace_sound=()=>{
      m(A3,0,0.1,"square", 0.15,400);
      m(E3,0.08,0.15,"square",0.15,400);
    };
    const enter_sound=()=>{
      m(A4,0,0.12,"triangle",0.2,6000);
      m(E5,0.1,0.2,"triangle",0.2,6000);
    };
    const victory_sound=()=>{
      [C5,E5,G5,C6].forEach((n,i)=>{
        m(n,i*0.15,i==3?0.9:0.3,"triangle",0.2,8000);
      });
      m(E5,0.45,0.9,"triangle",0.12,8000);
      m(G5,0.45,0.9,"triangle",0.12,8000);
    };
</script>
</html>
