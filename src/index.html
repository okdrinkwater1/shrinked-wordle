<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wordle</title>
    <style>
      body{
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
      }
      hr{
        width: 500px;
      }
      #title{
        font-size: 36px;
        font-weight: bold;
        letter-spacing: 2px;
      }
      #board {
        width: 350px;
        height: 420px;
        margin: 0 auto;
        margin-top: 3px;
        display: flex;
        flex-wrap:wrap;
      }
      .tile{
        border:2px solid lightgray;
        width: 60px;
        height:60px;
        margin: 2.5px;

        color: black;
        font-size: 36px;
        font-weight: bold;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .correct {
        background-color: green;
        color: white;
        border-color: white;
      }
      .present {
        background-color: yellow;
        color: white;
        border-color: white;
      }
      .absent {
       background-color: blue;
       color: white;
       border-color: white;
      }
    </style>
</head>
<body>
    <h1>Wordle</h1>
    <hr>
    <br>
    <div id="board">
    </div>

    <br>
    <h1 id="answer"></h1>
</body>
<script>
  const height=6, width= 5;
  let row=0, column=0;
  let gameOver=false;
  const word= "APPLE";

  const start = ()=>{
    for(let r=0;r<height;r++){
        for(let c=0;c<width;c++){
            let tile=document.createElement("span");
            tile.id=r.toString() + "-" + c.toString();
            tile.classList.add("tile");
            tile.innerText="p";
            document.getElementById("board").appendChild(tile);
        }
    }
  };
  start();
</script>
</html>
